<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema de Gerenciamento para Laboratório de Análises Clínicas">
  <title>Login | Laboratório de Análises Clínicas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKqnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../static/css/style.css">
</head>

<body class="auth-body">
  <button class="icon-button theme-toggle auth-theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme">
    <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
  </button>
  
  <main class="auth-page">
    <section class="auth-card">
      <!-- Mostrar erro se existir -->
      {% if error %}
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        {{ error }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      {% endif %}
      
      <!-- ← MUDOU: action="/" e method="POST" -->
      <form class="needs-validation" method="POST" action="/" novalidate>
        <div class="text-center mb-4">
          <img src="../static/img/imgs/logo.png" alt="Logo Laboratório de Análises Clínicas" style="width: 120px; height: 120px; border-radius: 12px; object-fit: contain; display: block; margin: 0 auto;">
          <h1 class="h4 mt-3 mb-0" style="font-weight: 700; color: var(--admin-text, #1f2937);">Laboratório de Análises Clínicas</h1>
          <p class="text-muted small" style="margin-top: 0.25rem;">Sistema de Gerenciamento</p>
        </div>

        <!-- ← MUDOU: name="nome" em vez de email -->
        <div class="mb-3">
          <label class="form-label" for="loginUsuario">Usuário</label>
          <input class="form-control" id="loginUsuario" type="text" name="nome" placeholder="Digite seu usuário" required>
          <div class="invalid-feedback">Digite um usuário válido.</div>
        </div>
        
        <!-- ← MUDOU: name="senha" em vez de password -->
        <div class="mb-3">
          <div class="d-flex justify-content-between">
            <label class="form-label" for="loginPassword">Senha</label>
          </div>
          <input class="form-control" id="loginPassword" type="password" name="senha" placeholder="Digite sua senha" minlength="6" required>
          <div class="invalid-feedback">A senha deve ter pelo menos 6 caracteres.</div>
        </div>
        
        <div class="form-check mb-4">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Lembrar-me</label>
        </div>
        
        <button class="btn btn-primary w-100" type="submit">
          <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Entrar
        </button>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="../static/js/main.js"></script>
</body>
</html>
